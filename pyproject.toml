[project]
name = "bbo-bot"
version = "0.1.0"
description = "La voz de Barcelona Bitcoin Only en Telegram"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.116",
    "python-telegram-bot[job-queue]>=21.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["bbo_bot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # los textos van en castellano, con tildes

[tool.ruff.lint.per-file-ignores]
"bbo_bot/persona.py" = ["E501"]  # es un prompt, no código
